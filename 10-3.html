<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-3 媒体查询</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }
        .viewport-box {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: #244d68;
            color: #fff;
            transition: background-color 300ms ease;
            font-family: "Microsoft YaHei", sans-serif;
        }
        h1 {
            margin: 0;
            font-size: clamp(40px, 10vw, 96px);
        }
        @media (max-width: 600px) {
            .viewport-box { background-color: #287c68; }
        }
        @media (min-width: 601px) and (max-width: 1000px) {
            .viewport-box { background-color: #c66c3d; }
        }
        @media (min-width: 1001px) {
            .viewport-box { background-color: #244d68; }
        }
        @media (prefers-reduced-motion: reduce) {
            .viewport-box { transition: none; }
        }
    </style>
</head>
<body>
    <main class="viewport-box">
        <h1>庞磊</h1>
    </main>
</body>
</html>
