<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .flex{
            display:flex;
            flex-wrap: wrap;
        }
        .flex li{
            /*float: left;*/
            border: 1px solid #333;
            width: 49%;
            line-height: 100px;
            list-style: none;
            text-align: center;
            flex-grow: 1;
            display: flex;

        }
        .flex li:nth-child(1){
            align-items: center;
            justify-content: center;
        }
        .box{
            width: 50%px;
            height: 50%px;
            background: #f1f2f3;
        }
        .flex li:nth-child(1) .box{
            background: #333;
        }
    </style>
</head>
<body>
    <h2>庞磊 flex</h2>
    <ul class="flex">
        <li>
            <div class="box">

            </div>
        </li>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul> 
</body>
</html>
