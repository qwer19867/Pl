<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>11-2 CSS 3D 动画</title>
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			background: radial-gradient(circle at 50% 30%, #2b3a55 0%, #12161f 70%);
			font-family: "Microsoft YaHei", sans-serif;
		}
		.pl_scene {
			width: 240px;
			height: 240px;
			perspective: 900px;
		}
		.pl_cube {
			position: relative;
			width: 100%;
			height: 100%;
			transform-style: preserve-3d;
			animation: pl_spin 12s linear infinite;
		}
		.pl_face {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			color: #fff;
			font-size: 30px;
			font-weight: 700;
			letter-spacing: 4px;
			border: 2px solid rgba(255, 255, 255, 0.35);
			background: rgba(76, 175, 165, 0.55);
			backdrop-filter: blur(4px);
		}
		.pl_front  { transform: translateZ(120px); }
		.pl_back   { transform: rotateY(180deg) translateZ(120px); }
		.pl_right  { transform: rotateY(90deg) translateZ(120px); }
		.pl_left   { transform: rotateY(-90deg) translateZ(120px); }
		.pl_top    { transform: rotateX(90deg) translateZ(120px); }
		.pl_bottom { transform: rotateX(-90deg) translateZ(120px); }
		.pl_front  { background: rgba(233, 93, 117, 0.6); }
		.pl_back   { background: rgba(233, 154, 69, 0.6); }
		.pl_right  { background: rgba(57, 168, 139, 0.6); }
		.pl_left   { background: rgba(71, 124, 194, 0.6); }
		.pl_top    { background: rgba(150, 96, 191, 0.6); }
		.pl_bottom { background: rgba(64, 186, 210, 0.6); }
		@keyframes pl_spin {
			0% {
				transform: rotateX(-20deg) rotateY(0deg);
			}
			100% {
				transform: rotateX(-20deg) rotateY(360deg);
			}
		}
		@media (prefers-reduced-motion: reduce) {
			.pl_cube { animation: none; transform: rotateX(-20deg) rotateY(-30deg); }
		}
	</style>
</head>
<body>
	<div class="pl_scene">
		<div class="pl_cube">
			<div class="pl_face pl_front">庞磊</div>
			<div class="pl_face pl_back">CSS</div>
			<div class="pl_face pl_right">3D</div>
			<div class="pl_face pl_left">动画</div>
			<div class="pl_face pl_top">TOP</div>
			<div class="pl_face pl_bottom">BOTTOM</div>
		</div>
	</div>
</body>
</html>
