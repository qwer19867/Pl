<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 庞磊</title>
</head>
<form>
    <h2>HTML表单form</h2>
    <form action="http://huanqiu.com"  name="pl">
        <p>
            用户名：<input type="text" name="username">
        </p>
        <p>
            密码：<input type="password" name="password">
        </p>
        <p>
            性别:<input type="radio" name="sex" value="m">男
            <input type="radio" name="sex" value="f">女
            <input type="radio" name="sex" value="s">保密
        </p>
        <p>
            爱好:<input type="checkbox" name="hobby" value="1">篮球
            <input type="checkbox" name="hobby" value="2">足球
            <input type="checkbox" name="hobby" value="3">羽毛球
        </p>
        <p>
            籍贯:<select name="jiguan">
                <option value="bj">北京</option>
                <option value="sh" selected>上海</option>
                <option value="gz">广州</option>
                <option value="sz">深圳</option>
            </select>
        </p>
        <p>
            个人简介:<textarea name="jianjie" rows="5" cols="30">请输入个人简介</textarea>
        </p>
        <p>
            出生日期:<input type="date" name="birthday">
        </p>
        <p>
            多文件上传:<input type="file" name="file" multiple>
        </p>
        <p>
            <input type="button" value="普通">
            <input type="submit" value="提交">  
            <input type="reset" value="重置">
        </p>

        
    </form>
            <button>表单外的按钮</button>

</form>
</body>
</html>
