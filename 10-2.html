<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-2 CSS Animation 幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 16px;
            display: grid;
            place-items: center;
            background: #eef2ef;
            color: #1c2925;
            font-family: "Microsoft YaHei", sans-serif;
        }
        main {
            width: min(960px, 100%);
        }
        h1 {
            margin: 0 0 18px;
            font-size: 24px;
        }
        .slideshow {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            position: relative;
            background: #18221f;
            box-shadow: 0 18px 45px rgba(24, 34, 31, 0.2);
        }
        .slides {
            display: flex;
            width: 400%;
            height: 100%;
            animation: move-slides 18s linear infinite;
        }
        .slideshow:hover .slides {
            animation-play-state: paused;
        }
        .slide {
            position: relative;
            flex: 0 0 25%;
            height: 100%;
            overflow: hidden;
        }
        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .caption {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.62);
            color: #fff;
        }
        .caption h2 {
            margin: 0 0 5px;
            font-size: 20px;
        }
        .caption p {
            margin: 0;
            font-size: 14px;
        }
        @keyframes move-slides {
            0%, 27% { transform: translateX(0); }
            33.333%, 60% { transform: translateX(-25%); }
            66.666%, 93% { transform: translateX(-50%); }
            100% { transform: translateX(-75%); }
        }
        @media (max-width: 540px) {
            body { padding: 20px 12px; }
            h1 { font-size: 20px; }
            .caption { padding: 10px 12px; }
            .caption h2 { margin-bottom: 2px; font-size: 16px; }
            .caption p { font-size: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .slides { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <h1>庞磊的 CSS Animation 幻灯片</h1>
        <section class="slideshow" aria-label="图片幻灯片">
            <div class="slides">
                <article class="slide">
                    <img src="./1.jpg" alt="幻灯片图片一">
                    <div class="caption">
                        <h2>庞磊的图片展示</h2>
                        <p>第一张图片</p>
                    </div>
                </article>
                <article class="slide">
                    <img src="./2.jpg" alt="幻灯片图片二">
                    <div class="caption">
                        <h2>发现不同的风景</h2>
                        <p>第二张图片</p>
                    </div>
                </article>
                <article class="slide">
                    <img src="./3.jpg" alt="幻灯片图片三">
                    <div class="caption">
                        <h2>记录美好瞬间</h2>
                        <p>第三张图片</p>
                    </div>
                </article>
                <article class="slide" aria-hidden="true">
                    <img src="./1.jpg" alt="">
                    <div class="caption">
                        <h2>庞磊的图片展示</h2>
                        <p>第一张图片</p>
                    </div>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
