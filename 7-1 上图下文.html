<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        ul{
            list-style: none;
        }
        img{
            display: block;
        }
        .ilist{
            display: flex;
        }
        .ilist li{
            width:30%;
            margin-right:3px;
            flex-grow: 1;
            position: relative;
        }
        .ilist img{
            width: 100%;
        }
        .ilist p{
            text-align: center;
            font-size: 14px;
            line-height: 33px;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-weight: bold;
        }
        
    </style>
</head>
<body>
    <ul class="ilist">
        <li><img src="./1.jpg">
            <p>庞磊的上图下文</p>
        </li>
        <li><img src="./2.jpg">
            <p>图片2</p>
        </li>
        <li><img src="./3.jpg">
            <p>图片3</p>
        </li>
    </ul>
</body>
</html>
