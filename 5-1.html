<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css"><link>
    <style>
        p{
            color: #f00;
            font-size: 100px;
        }
        .text{
            color: green;
        }
        #text{
            color: purple;
        }
        .box p{
            color: orange;
        }
        #box #text{
            color: silver;
        }
        .text{
            color: yellow!important;
        }
        #box{
            width: 1400px;
            height: 400px;
            background-color: gray;
            margin: 10px;
            padding: 10px;
            letter-spacing: 25px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h2>层叠与继承</h2>
    <div id="box" class="box">
        <p id="text" class="text">404 庞磊</p>
        <p>层叠与继承的优先级</p>
    </div>
</body>
</html>
